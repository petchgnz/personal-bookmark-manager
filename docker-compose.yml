services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: personal_bookmark_manager
      POSTGRES_USER: bookmark_app
      POSTGRES_PASSWORD: bookmark_app_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookmark_app -d personal_bookmark_manager"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    profiles: [app]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migration
    environment:
      DATABASE_URL: postgresql://bookmark_app:bookmark_app_password@postgres:5432/personal_bookmark_manager
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true

  backend:
    profiles: [app]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql://bookmark_app:bookmark_app_password@postgres:5432/personal_bookmark_manager
      PORT: "3001"
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  frontend:
    profiles: [app]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
    env_file:
      - frontend/.env
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
