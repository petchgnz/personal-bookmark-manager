services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: personal_bookmark_manager
      POSTGRES_USER: bookmark_app
      POSTGRES_PASSWORD: bookmark_app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookmark_app -d personal_bookmark_manager"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
