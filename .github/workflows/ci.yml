name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: personal_bookmark_manager
          POSTGRES_USER: bookmark_app
          POSTGRES_PASSWORD: bookmark_app_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bookmark_app -d personal_bookmark_manager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://bookmark_app:bookmark_app_password@localhost:5433/personal_bookmark_manager

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=backend

      - name: Apply database migrations
        run: npm run prisma:migrate:deploy --workspace=backend

      - name: Seed deterministic fixtures
        run: npm run prisma:seed --workspace=backend

      - name: Run repository verification
        run: npm run verify
